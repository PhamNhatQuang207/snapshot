# Local development: Postgres + post-service. `docker compose up -d --build`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: snapshot
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d snapshot"]
      interval: 2s
      timeout: 3s
      retries: 15

  post-service:
    build: ./services/post-service
    environment:
      DATABASE_URL: postgres://app:local@postgres:5432/snapshot?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
