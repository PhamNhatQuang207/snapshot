{{- if .Values.secretEnv.remoteKey }}
# Asks External Secrets to copy a Secrets Manager secret into a Kubernetes Secret.
# Git holds only this pointer, never the value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretEnv.targetSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.secretEnv.targetSecretName }}
  dataFrom:
    - extract:
        key: {{ .Values.secretEnv.remoteKey }}
{{- end }}
