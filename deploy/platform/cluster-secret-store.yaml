# Tells External Secrets where the vault is: AWS Secrets Manager in Singapore.
# No credentials here: the controller authenticates with its EKS Pod Identity role,
# which can only read secrets named snapshot/*. Applied by Argo CD (Task 9).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
